name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            # Pure-JS plugin: no npm, no build. Just verify main.js parses.
            # ubuntu-latest runners have Node preinstalled; skip setup-node.

            - name: Verify main.js parses
              run: node --check main.js

            - name: Verify manifest.json valid
              run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

            - name: Verify versions.json valid
              run: node -e "JSON.parse(require('fs').readFileSync('versions.json', 'utf8'))"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}